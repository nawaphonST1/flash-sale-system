worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Format แสดงชัดเจนว่า Nginx ส่ง Request ไปให้ Upstream Instance ตัวไหน
    log_format upstreamlog '[$time_local] $remote_addr "$request" Status: $status -> Forwarded to: $upstream_addr (Response Time: ${upstream_response_time}s)';
    access_log /dev/stdout upstreamlog;

    # ==========================================
    # 1. Upstream Auth Cluster (Round Robin)
    # ==========================================
    upstream auth_backend {
        # Round Robin เป็น default algorithm ของ Nginx
        server auth-app-1:3000;
        server auth-app-2:3000;
        server auth-app-3:3000;
    }

    # ==========================================
    # 2. Upstream Read Load (/api/v1/products) [เตรียมไว้สำหรับอนาคต]
    # ==========================================
    upstream product_read_backend {
        server auth-app-1:3000;
        server auth-app-2:3000;
        server auth-app-3:3000;
    }

    # ==========================================
    # 3. Upstream Write Load (/api/v1/orders) [เตรียมไว้สำหรับอนาคต]
    # ==========================================
    upstream order_write_backend {
        server auth-app-1:3000;
        server auth-app-2:3000;
        server auth-app-3:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # ส่ง Header ระบุว่า Upstream ตัวไหนเป็นผู้ประมวลผล (สำหรับการตรวจสอบ Round Robin)
        add_header X-Served-By $upstream_addr always;

        # ------------------------------------------
        # Health & Ping Checks (/health)
        # ------------------------------------------
        location /health {
            proxy_pass http://auth_backend/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Auth Request (/api/v1/auth/token) -> Round Robin
        # ------------------------------------------
        location /api/v1/auth/ {
            proxy_pass http://auth_backend/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Read Load (/api/v1/products) [เตรียมไว้]
        # ------------------------------------------
        location /api/v1/products/ {
            proxy_pass http://product_read_backend/api/v1/products/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Write Load (/api/v1/orders) [เตรียมไว้]
        # ------------------------------------------
        location /api/v1/orders/ {
            proxy_pass http://order_write_backend/api/v1/orders/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Catch-all Route
        location / {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
