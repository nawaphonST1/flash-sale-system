worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    keepalive_requests 100000;

    # Gzip Compression (Reduces Bandwidth & Payload Size)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        text/plain
        text/css
        application/javascript;


    # Disable stdout access log to prevent Docker log pipe bottleneck under high RPS
    access_log off;

    # ==========================================
    # 1. Upstream Auth Cluster (Round Robin)
    # ==========================================
    upstream auth_backend {
        server auth-app-1:3000 max_fails=0;
        server auth-app-2:3000 max_fails=0;
        server auth-app-3:3000 max_fails=0;
        server auth-app-4:3000 max_fails=0;
        server auth-app-5:3000 max_fails=0;
        server auth-app-6:3000 max_fails=0;
        keepalive 1024;
    }

    # ==========================================
    # 2. Upstream Read Load (/api/v1/products)
    # ==========================================
    upstream product_read_backend {
        server auth-app-1:3000 max_fails=0;
        server auth-app-2:3000 max_fails=0;
        server auth-app-3:3000 max_fails=0;
        server auth-app-4:3000 max_fails=0;
        server auth-app-5:3000 max_fails=0;
        server auth-app-6:3000 max_fails=0;
        keepalive 1024;
    }

    # ==========================================
    # 3. Upstream Write Load (/api/v1/orders)
    # ==========================================
    upstream order_write_backend {
        server auth-app-1:3000 max_fails=0;
        server auth-app-2:3000 max_fails=0;
        server auth-app-3:3000 max_fails=0;
        server auth-app-4:3000 max_fails=0;
        server auth-app-5:3000 max_fails=0;
        server auth-app-6:3000 max_fails=0;
        keepalive 1024;
    }

    server {
        listen 80 backlog=65535;
        server_name localhost;

        # Proxy Buffers & Timeouts for High Load
        proxy_buffers 32 64k;
        proxy_buffer_size 128k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        # ส่ง Header ระบุว่า Upstream ตัวไหนเป็นผู้ประมวลผล (สำหรับการตรวจสอบ Round Robin)
        add_header X-Served-By $upstream_addr always;

        # ------------------------------------------
        # Health & Ping Checks (/health)
        # ------------------------------------------
        location /health {
            proxy_pass http://auth_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Auth Request (/api/v1/auth/token) -> Round Robin
        # ------------------------------------------
        location /api/v1/auth {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Read Load (/api/v1/products) -> Round Robin
        # ------------------------------------------
        location /api/v1/products {
            proxy_pass http://product_read_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Admin / Reset Request (/api/v1/admin/reset) -> Round Robin
        # ------------------------------------------
        location /api/v1/admin {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # Write Load (/api/v1/orders) [เตรียมไว้]
        # ------------------------------------------
        location /api/v1/orders {
            proxy_pass http://order_write_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Catch-all Route
        location / {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
