worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Format แสดงชัดเจนว่า Nginx ส่ง Request ไปให้ Upstream Instance ตัวไหน
    log_format upstreamlog '[$time_local] $remote_addr "$request" Status: $status -> Forwarded to: $upstream_addr (Response Time: ${upstream_response_time}s)';
    access_log /dev/stdout upstreamlog;

    # ==========================================
    # 1. Heavy / Concurrency Workload (Least Connections)
    # สำหรับ /api/v1/orders (Write-Heavy)
    # ==========================================
    upstream backend_heavy {
        least_conn; # ส่งไปยัง Instance ที่มี Active Connection น้อยที่สุด
        server auth-app-1:3000 max_fails=3 fail_timeout=30s;
        server auth-app-2:3000 max_fails=3 fail_timeout=30s;
        server auth-app-3:3000 max_fails=3 fail_timeout=30s;
    }

    # ==========================================
    # 2. Fast / Standard Workload (Round Robin)
    # สำหรับ /api/v1/products (Read Load), /api/v1/auth/, /health
    # ==========================================
    upstream backend_fast {
        # Round Robin เป็นค่า Default ของ Nginx
        server auth-app-1:3000;
        server auth-app-2:3000;
        server auth-app-3:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Timeout Settings
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # DRY: กำหนด Proxy Headers ที่ระดับ Server ครั้งเดียว (ทุก Location จะ Inherit ไปใช้)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By $upstream_addr always;

        # ------------------------------------------
        # 1. Write-Heavy Load (/api/v1/orders) -> Least Connections
        # ------------------------------------------
        location /api/v1/orders {
            proxy_pass http://backend_heavy;
        }

        # ------------------------------------------
        # 2. Read-Heavy Load (/api/v1/products) -> Least Connections
        # ------------------------------------------
        location /api/v1/products {
            proxy_pass http://backend_heavy;
        }

        # ------------------------------------------
        # 3. Auth Request (/api/v1/auth/) -> Round Robin (Fast)
        # ------------------------------------------
        location /api/v1/auth {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend_fast/api/v1/auth/;


        # ------------------------------------------
        # 4. Health Check -> Round Robin (Fast)
        # ------------------------------------------
        location /api/v1/products {
            proxy_pass http://product_read_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend_fast/api/v1/health;


        # ------------------------------------------
        # 5. Default Catch-all -> Round Robin (Fast)
        # ------------------------------------------
        location /api/v1/orders {
            proxy_pass http://order_write_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Catch-all Route
        location / {
            proxy_pass http://backend_fast;
        }
    }
}
