      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-flash_sale_db}
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 4 (Auth & App)
  # ==========================================
  auth-app-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-4
