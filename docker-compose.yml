services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: flash_sale_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Redis (Cache, Lock, Queue)
  # ==========================================
  flash-sale-redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Nginx Load Balancer (Reverse Proxy)
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: flash-sale-nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-app-1
      - auth-app-2
      - auth-app-3
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 1 (Auth & App)
  # ==========================================
  auth-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-1
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - PORT=3000
      - INSTANCE_ID=auth-instance-1
      - JWT_SECRET=super_secret_flash_sale_key_2026_change_in_prod
      - JWT_EXPIRES_IN=1d
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=123456
      - DB_NAME=flash_sale_db
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 2 (Auth & App)
  # ==========================================
  auth-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-2
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - PORT=3000
      - INSTANCE_ID=auth-instance-2
      - JWT_SECRET=super_secret_flash_sale_key_2026_change_in_prod
      - JWT_EXPIRES_IN=1d
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=123456
      - DB_NAME=flash_sale_db
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 3 (Auth & App)
  # ==========================================
  auth-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-3
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - PORT=3000
      - INSTANCE_ID=auth-instance-3
      - JWT_SECRET=super_secret_flash_sale_key_2026_change_in_prod
      - JWT_EXPIRES_IN=1d
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=123456
      - DB_NAME=flash_sale_db
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
    networks:
      - flash-sale-net
    restart: unless-stopped

networks:
  flash-sale-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
