services:
  # ==========================================
  # PostgreSQL Primary Database (Master)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    command: postgres -c max_connections=300 -c shared_buffers=192MB -c work_mem=4MB -c synchronous_commit=off
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-flash_sale_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Redis (Cache, Lock, Queue)
  # ==========================================
  flash-sale-redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Nginx Load Balancer (Reverse Proxy)
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: flash-sale-nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-app-1
      - auth-app-2
      - auth-app-3
      - auth-app-4
      - auth-app-5
      - auth-app-6
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 1 (Auth & App)
  # ==========================================
  auth-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-1
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - ROLE=api
      - PORT=3000
      - INSTANCE_ID=auth-instance-1
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-flash_sale_db}
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 2 (Auth & App)
  # ==========================================
  auth-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-2
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - ROLE=api
      - PORT=3000
      - INSTANCE_ID=auth-instance-2
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-flash_sale_db}
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Backend Instance 3 (Auth & App)
  # ==========================================
  auth-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-auth-app-3
