      - INSTANCE_ID=auth-instance-6
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-flash_sale_db}
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Background Worker Instance (BullMQ Queue Consumer)
  # ==========================================
  worker-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-sale-worker-1
    depends_on:
      - postgres
      - flash-sale-redis
    environment:
      - ROLE=worker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-flash_sale_db}
      - REDIS_HOST=flash-sale-redis
      - REDIS_PORT=6379
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Prometheus (Metrics Collector)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: flash-sale-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - flash-sale-net
    restart: unless-stopped

  # ==========================================
  # Grafana (Metrics Dashboard)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: flash-sale-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - flash-sale-net
    restart: unless-stopped

networks:
  flash-sale-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
